  --accent-ink:#12211f;

  --deporte:#83bab2;
  --deporte-soft:#28403c;

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-inline:16px;
  padding-block:24px 48px;
  max-width:640px;
  margin-inline:auto;
}
h1,h2,h3{font-family:'Zilla Slab',Georgia,'Times New Roman',serif; margin:0; text-wrap:balance}
header.top{margin-bottom:14px}
header.top h1{font-size:1.7rem; font-weight:600; letter-spacing:-.01em}
header.top p{margin:.35rem 0 0; color:var(--ink-soft); font-size:.92rem}
.viewnav{display:flex; gap:6px; margin-bottom:16px}
.viewnav button{
  flex:1; font:inherit; font-weight:700; font-size:.8rem; color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:10px 6px; cursor:pointer; text-align:center;
}
.viewnav button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.sectiontitle{font-size:1.25rem; margin:4px 0 14px}
.weekbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:14px; padding:10px 14px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow); flex-wrap:wrap;
}
.weekbar .wk{font-size:.85rem; color:var(--ink-soft)}
.weekbar button{
  font:inherit; font-size:.8rem; background:none; border:1px solid var(--line); color:var(--ink-soft);
  padding:6px 10px; border-radius:8px; cursor:pointer;
}
.weekbar button:hover{border-color:var(--accent); color:var(--accent)}
.tabs{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:14px;
}
.tab{
  font:inherit; font-size:.85rem; font-weight:600; color:var(--ink-soft); text-align:center;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:9px 8px; cursor:pointer; white-space:nowrap;
}
.tab .n{display:block; font-weight:400; font-size:.72rem; opacity:.75; margin-top:1px}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tab.today:not([aria-selected="true"]){box-shadow:inset 0 0 0 1.5px var(--accent)}
.daysummary{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap}
.daysummary h2{font-size:1.25rem}
.daysummary .tot{font-size:.85rem; color:var(--ink-soft)}
.list{display:flex; flex-direction:column; gap:8px}
.entry{
  display:flex; align-items:flex-start; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:12px 12px; box-shadow:var(--shadow);
}
.entry.done{opacity:.6}
.entry .check{flex:0 0 auto; padding-top:2px}
.entry .check input{
  appearance:none; width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line);
  background:var(--surface-2); cursor:pointer; position:relative; display:block;
}
.entry .check input:checked{background:var(--accent); border-color:var(--accent)}
.entry .check input:checked::after{
  content:""; position:absolute; left:7px; top:3px; width:6px; height:11px;
  border:solid var(--accent-ink); border-width:0 2.5px 2.5px 0; transform:rotate(45deg);
}
.entry .body{flex:1; min-width:0}
.entry .row1{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.entry .time{font-variant-numeric:tabular-nums; font-size:.82rem; color:var(--ink-soft); white-space:nowrap}
.entry .name{font-weight:700; font-size:1rem; margin-top:2px}
.entry.done .name{text-decoration:line-through; text-decoration-color:var(--ink-soft)}
.entry .note-text{font-size:.92rem; line-height:1.45; margin-top:4px; white-space:pre-wrap}
.entry audio{width:100%; margin-top:6px; height:36px}
.chip{
  font-size:.68rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px; white-space:nowrap;
}
.entry .actions{flex:0 0 auto; display:flex; gap:4px}
.iconbtn{
  border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:6px; border-radius:8px;
  font-size:.95rem; line-height:1;
}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.addbtn{
  margin-top:12px; width:100%; font:inherit; font-weight:700; font-size:.88rem; color:var(--accent);
  background:var(--accent-soft); border:1px dashed var(--accent); border-radius:12px; padding:12px;
  cursor:pointer;
}
.addbtn:hover{filter:brightness(0.97)}
.empty{color:var(--ink-soft); font-size:.9rem; padding:18px 4px}
.formcard{
  margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:16px; box-shadow:var(--shadow);
}
.formcard h3{font-size:1.02rem; margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block; font-size:.78rem; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.02em}
.field input[type=text], .field select, .field input[type=time], .field input[type=date], .field textarea{
  width:100%; font:inherit; font-size:.95rem; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink);
}
.field textarea{resize:vertical; min-height:90px}
.field input[type=color]{width:100%; height:40px; padding:2px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer}
.field-row{display:flex; gap:10px}
.field-row .field{flex:1}
.formactions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap}
.btn{font:inherit; font-weight:700; font-size:.88rem; padding:10px 16px; border-radius:9px; border:1px solid transparent; cursor:pointer}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:none; border-color:var(--line); color:var(--ink)}
.btn.danger{background:var(--danger-soft); color:var(--danger)}
.notes-controls{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.notes-controls .btn{flex:1; min-width:150px}
.recording-card{
  display:flex; align-items:center; gap:12px; background:var(--danger-soft); border:1px solid var(--danger);
  border-radius:12px; padding:14px; margin-bottom:12px;
}
.recording-card .dot{width:10px; height:10px; border-radius:50%; background:var(--danger); flex:0 0 auto; animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.recording-card .rlabel{flex:1; font-size:.88rem; color:var(--ink)}
.recording-card .rt{font-variant-numeric:tabular-nums; font-weight:700; color:var(--danger)}
.legend{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; font-size:.75rem; color:var(--ink-soft)}
.legend-item{display:inline-flex; align-items:center; gap:5px}
.legend-item i{width:9px; height:9px; border-radius:3px; display:inline-block}
.catdel{border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:.95rem; line-height:1; padding:0 2px}
.catdel:hover{color:var(--danger)}
footer.note{margin-top:26px; font-size:.78rem; color:var(--ink-soft); line-height:1.5}
.authwrap{min-height:70vh; display:flex; align-items:center; justify-content:center; padding-block:24px}
.authcard{width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px 22px; box-shadow:var(--shadow)}
.authcard h1{font-size:1.4rem; margin-bottom:4px}
.authcard .sub{color:var(--ink-soft); font-size:.88rem; margin-bottom:18px}
.autherr{background:var(--danger-soft); color:var(--danger); font-size:.85rem; padding:9px 12px; border-radius:9px; margin-bottom:14px}
.authswitch{margin-top:14px; font-size:.85rem; color:var(--ink-soft); text-align:center}
.authswitch button{font:inherit; font-weight:700; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; text-decoration:underline}
.authcard .btn.primary{width:100%; padding:12px 16px}
.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.logoutbtn{
  flex:0 0 auto; font:inherit; font-size:.78rem; color:var(--ink-soft); background:var(--surface);
  border:1px solid var(--line); border-radius:9px; padding:8px 11px; cursor:pointer; margin-top:2px;
}
.logoutbtn:hover{border-color:var(--danger); color:var(--danger)}
.syncnote{font-size:.72rem; color:var(--ink-soft); margin-top:6px}
</style>
</head>

<script>
(function(){
"use strict";

var CACHE_KEY = "agenda-semanal-cache-v1";

var auth = firebase.auth();
var db = firebase.database();
var currentUser = null;
var dbRef = null;
var authMode = "login"; // "login" | "signup"
var authError = null;
var authBusy = false;

var DAYS = [
  {key:"lun", label:"Lunes"},
  {key:"mar", label:"Martes"},
  {key:"mie", label:"Miércoles"},
  {key:"jue", label:"Jueves"},
  {key:"vie", label:"Viernes"},
  {key:"sab", label:"Sábado"}
];
var BASE_CATS = [
  {key:"deporte", label:"Deporte", builtin:true},
  {key:"estudio", label:"Estudio", builtin:true},
  {key:"creativo", label:"Creativo", builtin:true},
  {key:"lectura", label:"Lectura", builtin:true}
];
var VIEWS = [
  {key:"agenda", label:"Agenda"},
  {key:"notas", label:"Notas"},
  {key:"estudios", label:"Estudios terminados"}
];

var STATE = null;
var currentView = "agenda";
var selectedDay = null;
var editingId = null; // null = no form, "new" = adding, number = editing that id
var noteMode = null; // null | "write" | "recording"
var studyMode = null; // null | "new" | number

var mediaRecorder = null, mediaStream = null, recordedChunks = [], recordingTimer = null, recordingSeconds = 0;

function normalizeState(s){
  if(!s || typeof s!=="object") s = {};
  if(!s.done) s.done = {};
  if(!s.entries) s.entries = [];
  if(!s.categories) s.categories = [];
  if(!s.notes) s.notes = [];
  if(!s.studies) s.studies = [];
  if(typeof s.nextId !== "number") s.nextId = 1;
  return s;
}

function defaultState(){
  return normalizeState(JSON.parse(document.getElementById("state-data").textContent));
}

function loadCachedState(){
  try{
    var raw = localStorage.getItem(CACHE_KEY);
    if(raw) return normalizeState(JSON.parse(raw));
  }catch(e){}
  return null;
}

function saveCachedState(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function pad(n){ return (n<10?"0":"")+n; }

var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function weekRangeLabel(refDate){
  var jsDay = refDate.getDay();
  var offset = (jsDay+6)%7;
  var monday = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate()-offset);
  var saturday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+5);
  if(monday.getMonth()===saturday.getMonth()){
    return "Semana del "+monday.getDate()+" al "+saturday.getDate()+" de "+MESES[monday.getMonth()];
  }
  return "Semana del "+monday.getDate()+" de "+MESES[monday.getMonth()]+" al "+saturday.getDate()+" de "+MESES[saturday.getMonth()];
}

function isoWeekKey(d){
  var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  var week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return date.getUTCFullYear() + "-W" + pad(week);
}

function todayDayKey(){
  var jsDay = new Date().getDay(); // 0 sun .. 6 sat
  var map = {1:"lun",2:"mar",3:"mie",4:"jue",5:"vie",6:"sab"};
  return map[jsDay] || null;
}

function todayISODate(){
  var d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function fmtDur(h){
  var totalMin = Math.round(h*60);
  var hh = Math.floor(totalMin/60), mm = totalMin%60;
  if(hh && mm) return hh+" h "+mm+" min";
  if(hh) return hh+" h";
  return mm+" min";
}

function fmtElapsed(s){
  var m = Math.floor(s/60), ss = s%60;
  return pad(m)+":"+pad(ss);
}

function fmtNoteDate(iso){
  var d = new Date(iso);
  return d.getDate()+" de "+MESES[d.getMonth()]+", "+pad(d.getHours())+":"+pad(d.getMinutes());
}

function fmtStudyDate(dstr){
  var parts = dstr.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
}

function addMinutes(hhmm, mins){
  var parts = hhmm.split(":");
  var total = parseInt(parts[0],10)*60 + parseInt(parts[1],10) + mins;
  total = ((total % 1440)+1440)%1440;
  return pad(Math.floor(total/60))+":"+pad(total%60);
}

function entriesForDay(day){
  return STATE.entries.filter(function(e){return e.day===day;}).sort(function(a,b){
    return a.start.localeCompare(b.start);
  });
}

function dayTotalHours(day){
  return entriesForDay(day).reduce(function(sum,e){return sum+e.dur;},0);
}

function esc(str){
  var d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function hexToRgb(hex){
  if(!hex) return null;
  var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if(!m) return null;
  return {r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16)};
}

function allCategories(){
  return BASE_CATS.concat(STATE.categories.map(function(c){
    return {key:c.key, label:c.label, color:c.color, builtin:false};
  }));
}

function getCategory(key){
  var found = allCategories().find(function(c){return c.key===key;});
  return found || BASE_CATS[0];
}

function catStyle(cat){
  if(cat.builtin){
    return "background:var(--"+cat.key+"-soft);color:var(--"+cat.key+")";
  }
  var rgb = hexToRgb(cat.color) || {r:100,g:100,b:100};
  return "background:rgba("+rgb.r+","+rgb.g+","+rgb.b+",.16);color:"+cat.color+";box-shadow:inset 0 0 0 1px rgba("+rgb.r+","+rgb.g+","+rgb.b+",.35)";
}

function ensureCurrentWeek(){
  var wk = isoWeekKey(new Date());
  if(STATE.weekKey !== wk){
    STATE.weekKey = wk;
    STATE.done = {};
    return true;
  }
  return false;
}

    var sel = d.key===selectedDay;

    html += '<button type="button" class="tab'+(d.key===todayKey?' today':'')+'" role="tab" aria-selected="'+sel+'" data-action="select-day" data-day="'+d.key+'">'+

    html += '<div class="list">';

      var done = !!STATE.done[e.id];

      var cat = getCategory(e.cat);
      html += '<div class="entry'+(done?' done':'')+'">';

    html += '<div class="field-row">';
    html += '<div class="field"><label for="f-day">Día</label><select id="f-day">';
    DAYS.forEach(function(d){ html += '<option value="'+d.key+'"'+(d.key===f.day?' selected':'')+'>'+d.label+'</option>'; });
    html += '</select></div>';
    html += '<div class="field"><label for="f-cat">Categoría</label><select id="f-cat">';
    allCategories().forEach(function(c){ html += '<option value="'+c.key+'"'+(c.key===f.cat?' selected':'')+'>'+esc(c.label)+'</option>'; });
    html += '<option value="__new__">+ Nueva categoría…</option>';

    html += '<div class="field-row" id="new-cat-fields" hidden>';
    html += '<div class="field"><label for="f-newcat-name">Nombre de la categoría</label><input type="text" id="f-newcat-name" maxlength="24" placeholder="Ej. Voluntariado"></div>';
    html += '<div class="field" style="max-width:100px"><label for="f-newcat-color">Color</label><input type="color" id="f-newcat-color" value="#4a6fa5"></div>';
    html += '</div>';

    html += '<div class="field"><label for="f-dur">Duración</label><select id="f-dur">';

      html += '<option value="'+h+'"'+(h===f.dur?' selected':'')+'>'+fmtDur(h)+'</option>';

function render(){
  var app = document.getElementById("app");

  if(!currentUser){
    app.innerHTML = renderAuthScreen();
    var af = document.getElementById("auth-form");
    if(af){ af.addEventListener("submit", function(ev){ ev.preventDefault(); submitAuthForm(); }); }
    return;
  }

  if(!STATE){
    app.innerHTML = '<div class="authwrap"><p class="empty">Cargando tu agenda…</p></div>';
    return;
  }

  var html = headerHtml();
  if(currentView==="agenda") html += renderAgenda();
  else if(currentView==="notas") html += renderNotas();
  else if(currentView==="estudios") html += renderEstudios();

  app.innerHTML = html;
  attachFormListeners();
}

function attachFormListeners(){
  var ef = document.getElementById("entry-form");
  if(ef){ ef.addEventListener("submit", function(ev){ ev.preventDefault(); saveForm(); }); }
  var nf = document.getElementById("note-form");
  if(nf){ nf.addEventListener("submit", function(ev){ ev.preventDefault(); saveNoteText(); }); }
  var sf = document.getElementById("study-form");
  if(sf){ sf.addEventListener("submit", function(ev){ ev.preventDefault(); saveStudyForm(); }); }
}

function submitAuthForm(){
  var email = document.getElementById("auth-email").value.trim();
  var password = document.getElementById("auth-password").value;
  authError = null;
  authBusy = true;
  render();
  var action = authMode==="signup"
    ? auth.createUserWithEmailAndPassword(email, password)
    : auth.signInWithEmailAndPassword(email, password);
  action.catch(function(err){
    authBusy = false;
    authError = authErrorMessage(err);
    render();
  });
}

function authErrorMessage(err){
  var code = err && err.code;
  if(code==="auth/invalid-email") return "Ese correo no es válido.";
  if(code==="auth/user-not-found") return "No existe una cuenta con ese correo. Prueba a crear una.";
  if(code==="auth/wrong-password" || code==="auth/invalid-credential") return "La contraseña no es correcta.";
  if(code==="auth/email-already-in-use") return "Ya existe una cuenta con ese correo. Prueba a entrar en vez de crearla.";
  if(code==="auth/weak-password") return "La contraseña debe tener al menos 6 caracteres.";
  if(code==="auth/network-request-failed") return "No hay conexión a internet.";
  return "Ha ocurrido un error. Inténtalo de nuevo.";
}

function saveForm(){
  var name = document.getElementById("f-name").value.trim();
  var day = document.getElementById("f-day").value;
  var cat = document.getElementById("f-cat").value;
  var start = document.getElementById("f-start").value || "09:00";
  var dur = parseFloat(document.getElementById("f-dur").value);
  if(!name) return;

  if(cat === "__new__"){
    var newName = document.getElementById("f-newcat-name").value.trim();
    var newColor = document.getElementById("f-newcat-color").value || "#4a6fa5";
    if(!newName){ alert("Escribe un nombre para la nueva categoría."); return; }
    var newKey = "c"+(STATE.nextId++);
    STATE.categories.push({key:newKey, label:newName, color:newColor});
    cat = newKey;
  }

  if(editingId==="new"){
    STATE.entries.push({id:STATE.nextId++, day:day, start:start, dur:dur, name:name, cat:cat});
  } else {
    var e = STATE.entries.find(function(x){return x.id===editingId;});
    if(e){ e.name=name; e.day=day; e.cat=cat; e.start=start; e.dur=dur; }
  }
  selectedDay = day;
  editingId = null;
  persist();
}

function saveNoteText(){
  var text = document.getElementById("note-text").value.trim();
  if(!text) return;
  STATE.notes.push({id:STATE.nextId++, type:"text", text:text, createdAt:new Date().toISOString()});
  noteMode = null;
  persist();
}

function saveStudyForm(){
  var name = document.getElementById("s-name").value.trim();
  var date = document.getElementById("s-date").value || todayISODate();
  var note = document.getElementById("s-note").value.trim();
  if(!name) return;
  if(typeof studyMode==="number"){
    var s = STATE.studies.find(function(x){return x.id===studyMode;});
    if(s){ s.name=name; s.date=date; s.note=note; }
  } else {
    STATE.studies.push({id:STATE.nextId++, name:name, date:date, note:note});
  }
  studyMode = null;
  persist();
}

function startRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==="undefined"){
    alert("Este dispositivo no permite grabar audio aquí. Puedes escribir la nota en su lugar.");
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaStream = stream;
    recordedChunks = [];
    try{
      mediaRecorder = new MediaRecorder(stream);
    }catch(e){
      alert("No se pudo iniciar la grabación. Puedes escribir la nota en su lugar.");
      stream.getTracks().forEach(function(t){t.stop();});
      return;
    }
    mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      var blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || "audio/webm"});
      var reader = new FileReader();
      reader.onload = function(){
        STATE.notes.push({id:STATE.nextId++, type:"audio", audio:reader.result, createdAt:new Date().toISOString()});
        noteMode = null;
        persist();
      };
      reader.readAsDataURL(blob);
      if(mediaStream){ mediaStream.getTracks().forEach(function(t){t.stop();}); mediaStream = null; }
    };
    mediaRecorder.start();
    recordingSeconds = 0;
    noteMode = "recording";
    render();
    recordingTimer = setInterval(function(){
      recordingSeconds++;
      var el = document.getElementById("rec-timer");
      if(el) el.textContent = fmtElapsed(recordingSeconds);
    }, 1000);
  }).catch(function(){
    alert("No se pudo acceder al micrófono. Puedes escribir la nota en su lugar.");
  });
}

function stopRecording(){
  if(recordingTimer){ clearInterval(recordingTimer); recordingTimer = null; }
  if(mediaRecorder && mediaRecorder.state!=="inactive"){ mediaRecorder.stop(); }
}

function cancelRecording(){
  if(recordingTimer){ clearInterval(recordingTimer); recordingTimer = null; }
  if(mediaRecorder){
    mediaRecorder.onstop = null;
    if(mediaRecorder.state!=="inactive"){ mediaRecorder.stop(); }
  }
  if(mediaStream){ mediaStream.getTracks().forEach(function(t){t.stop();}); mediaStream = null; }
  noteMode = null;
  render();
}

function noteCancel(){
  if(noteMode==="recording"){ cancelRecording(); }
  else { noteMode = null; render(); }
}

function persist(){
  render();
  saveCachedState();
  if(dbRef){ dbRef.set(STATE).catch(function(){ /* sin conexión: se reintentará solo cuando Firebase reconecte */ }); }
}

function onClick(ev){
  var btn = ev.target.closest("[data-action]");
  if(!btn) return;
  var action = btn.getAttribute("data-action");
  var idAttr = btn.getAttribute("data-id");
  var id = idAttr!==null ? parseInt(idAttr,10) : null;

  if(action==="select-view"){
    currentView = btn.getAttribute("data-view");
    editingId = null; noteMode = null; studyMode = null;
    render();
  } else if(action==="select-day"){
    selectedDay = btn.getAttribute("data-day");
    editingId = null;
    render();
  } else if(action==="toggle"){
    if(STATE.done[id]) delete STATE.done[id]; else STATE.done[id]=true;
    persist();
  } else if(action==="add"){
    editingId = "new";
    render();
  } else if(action==="edit"){
    editingId = id;
    render();
  } else if(action==="delete"){
    if(confirm("¿Eliminar esta actividad?")){
      STATE.entries = STATE.entries.filter(function(e){return e.id!==id;});
      delete STATE.done[id];
      editingId = null;
      persist();
    }
  } else if(action==="cancel-form"){
    editingId = null;
    render();
  } else if(action==="reset-week"){
    if(confirm("¿Borrar todas las marcas de esta semana?")){
      STATE.done = {};
      persist();
    }
  } else if(action==="delete-cat"){
    var key = btn.getAttribute("data-cat");
    if(confirm("¿Eliminar esta categoría? Las actividades que la usan pasarán a mostrarse como Deporte.")){
      STATE.categories = STATE.categories.filter(function(c){return c.key!==key;});
      persist();
    }
  } else if(action==="note-write"){
    noteMode = "write";
    render();
  } else if(action==="note-record"){
    startRecording();
  } else if(action==="note-stop"){
    stopRecording();
  } else if(action==="note-cancel"){
    noteCancel();
  } else if(action==="delete-note"){
    if(confirm("¿Eliminar esta nota?")){
      STATE.notes = STATE.notes.filter(function(n){return n.id!==id;});
      persist();
    }
  } else if(action==="study-add"){
    studyMode = "new";
    render();
  } else if(action==="study-edit"){
    studyMode = id;
    render();
  } else if(action==="study-cancel"){
    studyMode = null;
    render();
  } else if(action==="delete-study"){
    if(confirm("¿Eliminar este estudio?")){
      STATE.studies = STATE.studies.filter(function(s){return s.id!==id;});
      studyMode = null;
      persist();
    }
  } else if(action==="auth-toggle-mode"){
    authMode = authMode==="signup" ? "login" : "signup";
    authError = null;
    render();
  } else if(action==="auth-logout"){
    if(confirm("¿Cerrar sesión en este dispositivo?")){
      auth.signOut();
    }
  }
}

function onChange(ev){
  if(ev.target && ev.target.id==="f-cat"){
    var wrap = document.getElementById("new-cat-fields");
    if(wrap) wrap.hidden = (ev.target.value !== "__new__");
  }
}

function attachDbListener(uid){
  if(dbRef){ dbRef.off(); }
  dbRef = db.ref("users/"+uid+"/state");
  dbRef.on("value", function(snapshot){
    var remote = snapshot.val();
    if(remote){
      STATE = normalizeState(remote);
    } else {
      STATE = loadCachedState() || defaultState();
      dbRef.set(STATE).catch(function(){});
    }
    var changed = ensureCurrentWeek();
    saveCachedState();
    render();
    if(changed){ persist(); }
  }, function(){
    if(!STATE){ STATE = loadCachedState() || defaultState(); ensureCurrentWeek(); render(); }
  });
}

function init(){
  selectedDay = todayDayKey() || "lun";
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);

  auth.onAuthStateChanged(function(user){
    authBusy = false;
    if(user){
      currentUser = user;
      authError = null;
      attachDbListener(user.uid);
    } else {
      currentUser = null;
      STATE = null;
      if(dbRef){ dbRef.off(); dbRef = null; }
    }
    render();
  });

  render();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* sin conexión o archivo no disponible: la app sigue funcionando igual */ });
  });
}
})();
</script>
</body>
</html>
